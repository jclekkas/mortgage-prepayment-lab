# Manual deployment of the public synthetic demonstration to GitHub Pages.
# Runs only when someone triggers it; it never deploys automatically. GitHub Pages must
# be enabled for the repository (Settings > Pages > Source: GitHub Actions) first.
name: Deploy synthetic demo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to deploy (must have passed CI)
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:numerics
      - name: Build for the repository sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Record build metadata
        run: |
          echo "{\"commit\":\"$(git rev-parse HEAD)\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
